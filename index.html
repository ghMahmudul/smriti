<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Smriti</title>
    <meta name="description" content="Local-first task management powered by .todo files" />
    <meta name="application-name" content="Smriti" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="theme-color" content="#ffffff" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Smriti" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Smriti" />
    <meta property="og:description" content="Local-first task management powered by .todo files" />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Smriti" />
    <meta name="twitter:description" content="Local-first task management powered by .todo files" />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-91JQz3YzhXwA6aCn1voRwM2B/HhR50OgQu4Pu0gQyCQ=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: https://cloudflareinsights.com; worker-src 'self'; manifest-src 'self'"
    />
    <script>
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('smriti-workspace'));
          var theme = stored?.state?.settings?.theme;
          if (theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Smriti is a local-first application and requires JavaScript to run.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
